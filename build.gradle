plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        getspawners {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'getspawners-test'
        enableGameTests = true
        enableClientGameTests = project.hasProperty('clientTests')
    }
}

dependencies {
    // Optional local optimization mod for compatibility tests; never bundled in the release JAR.
    if (providers.gradleProperty('compatModJar').isPresent()) {
        localRuntime files(providers.gradleProperty('compatModJar').get())
    }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include(implementation("me.lucko:fabric-permissions-api:0.7.0"))
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    if (!project.hasProperty('withoutCloth')) {
        localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: "net.fabricmc.fabric-api"
        }
    }
}

if (project.hasProperty('clientTests')) {
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.runtimeClasspath
}

tasks.named('processGametestResources') {
    inputs.property('clientTests', project.hasProperty('clientTests'))
    if (project.hasProperty('clientTests')) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.environment = '*'
            metadata.entrypoints['fabric-client-gametest'] = ['net.getspawners.ClothConfigNoticeClientTest']
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
